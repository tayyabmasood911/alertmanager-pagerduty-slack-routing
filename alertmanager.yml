global:
  resolve_timeout: 5m
  http_config:
    tls_config:
      insecure_skip_verify: false
  slack_api_url: '${ALERTMANAGER_SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['namespace', 'alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-default'

  routes:
    # Critical infrastructure & outage route -> PagerDuty High Urgency & Slack War Room
    - match:
        severity: critical
      receiver: 'pagerduty-high-priority'
      continue: true

    - match:
        severity: critical
      receiver: 'slack-critical-warroom'

    # Database & Storage engineering routing
    - match:
        team: database
      receiver: 'pagerduty-dba-oncall'
      routes:
        - match:
            severity: warning
          receiver: 'slack-dba-alerts'

    # Security Incident & Compliance routing
    - match:
        team: security
      receiver: 'pagerduty-security-soc'
      continue: true

    - match:
        team: security
      receiver: 'slack-security-soc'

    # Warning alerts -> Team operational channels
    - match:
        severity: warning
      receiver: 'slack-warnings'

    # Non-critical info notifications -> Feed channel
    - match:
        severity: info
      receiver: 'slack-info-notifications'

inhibit_rules:
  # Inhibit warning alerts when a matching critical alert is already active
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit node-level alerts if the entire cluster/datacenter is declared unreachable
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: '.*(NodeDown|KubeletDown|PodCrashLooping).*'
    equal: ['cluster']

  # Inhibit downstream service alerts when core network/ingress gateway is failing
  - source_match:
      alertname: 'IngressControllerDown'
    target_match:
      service: 'api-gateway'
    equal: ['cluster', 'namespace']

receivers:
  # Default fallback Slack notification
  - name: 'slack-default'
    slack_configs:
      - channel: '#alerts-unrouted'
        send_resolved: true
        title: '{{ template "slack.custom.title" . }}'
        text: '{{ template "slack.custom.text" . }}'
        color: '{{ template "slack.custom.color" . }}'

  # Critical War Room channel receiver
  - name: 'slack-critical-warroom'
    slack_configs:
      - channel: '#incident-war-room'
        send_resolved: true
        icon_emoji: ':fire:'
        title: '🚨 [CRITICAL OUTAGE] {{ .CommonLabels.alertname }} ({{ .CommonLabels.cluster }})'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Impact:* {{ .CommonAnnotations.runbook_url }}
          *Active Alerts:* {{ len .Alerts }}
        color: 'danger'
        actions:
          - type: button
            text: 'Runbook :book:'
            url: '{{ .CommonAnnotations.runbook_url }}'
          - type: button
            text: 'Grafana Dashboard :chart_with_upwards_trend:'
            url: '{{ .CommonAnnotations.dashboard_url }}'
          - type: button
            text: 'Silence Alert :bell_slash:'
            url: '{{ template "__alert_silence_link" . }}'

  # PagerDuty High Urgency Receiver (P1 Incidents)
  - name: 'pagerduty-high-priority'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY_CRITICAL}'
        send_resolved: true
        severity: 'critical'
        client: 'Alertmanager Enterprise SRE'
        client_url: '{{ template "__alertmanagerURL" . }}'
        description: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} on {{ .CommonLabels.cluster }}/{{ .CommonLabels.service }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          cluster: '{{ .CommonLabels.cluster }}'
          namespace: '{{ .CommonLabels.namespace }}'
          service: '{{ .CommonLabels.service }}'
          severity: '{{ .CommonLabels.severity }}'
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
          firing_count: '{{ len .Alerts.Firing }}'

  # PagerDuty DBA on-call receiver
  - name: 'pagerduty-dba-oncall'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY_DBA}'
        send_resolved: true
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        client: 'Alertmanager DBA Engine'
        description: 'DB Alert: {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        details:
          service: '{{ .CommonLabels.service }}'
          engine: '{{ .CommonLabels.engine }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'

  # Slack DBA alerts channel
  - name: 'slack-dba-alerts'
    slack_configs:
      - channel: '#database-ops'
        send_resolved: true
        icon_emoji: ':floppy_disk:'
        title: '💾 [DB Alert] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}\nService: `{{ .CommonLabels.service }}`'
        color: 'warning'

  # Security Operations Center (SOC) PagerDuty Receiver
  - name: 'pagerduty-security-soc'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY_SOC}'
        send_resolved: true
        severity: 'critical'
        client: 'Alertmanager SOC Security Gateway'
        description: 'SECURITY ALERT: {{ .CommonLabels.alertname }} detected in {{ .CommonLabels.cluster }}'
        details:
          threat_type: '{{ .CommonLabels.threat_type }}'
          target_asset: '{{ .CommonLabels.target }}'
          mitre_tactic: '{{ .CommonLabels.mitre_tactic }}'

  # Slack Security SOC Channel
  - name: 'slack-security-soc'
    slack_configs:
      - channel: '#soc-threat-intel'
        send_resolved: true
        icon_emoji: ':shield:'
        title: '🛡️ [SECURITY INCIDENT] {{ .CommonLabels.alertname }}'
        text: |
          *Threat:* {{ .CommonAnnotations.summary }}
          *Affected Workload:* `{{ .CommonLabels.service }}` in `{{ .CommonLabels.namespace }}`
        color: 'danger'

  # General warnings channel
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        icon_emoji: ':warning:'
        title: '⚠️ [WARNING] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        text: '{{ .CommonAnnotations.summary }}\nDetails: {{ .CommonAnnotations.description }}'
        color: 'warning'

  # Informational alerts
  - name: 'slack-info-notifications'
    slack_configs:
      - channel: '#alerts-info'
        send_resolved: true
        icon_emoji: ':information_source:'
        title: 'ℹ️ [INFO] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
        color: 'good'
