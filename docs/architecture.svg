<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; fill: #64748b; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .node-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #0284c7; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .solid-arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Header Section -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="30" y="32" class="title">Alertmanager Intelligent Notification Architecture</text>
    <text x="30" y="52" class="subtitle">Multi-Tier Route Trees, Deduplication, Inhibition Rules, PagerDuty P1 Escalation &amp; Slack Webhook Orchestration</text>
    <rect x="910" y="22" width="140" height="26" rx="13" fill="#0284c7"/>
    <text x="980" y="39" text-anchor="middle" class="badge-text">PRODUCTION READY</text>
  </g>

  <!-- Stage 1: Ingestion & Telemetry Sources -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="220" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" class="group-title">1. Alert Sources</text>

    <!-- Source Box 1: Prometheus -->
    <g transform="translate(15, 55)">
      <rect width="190" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <path d="M 21 27 L 25 18 L 29 27 Z" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">Prometheus K8s</text>
      <text x="45" y="38" class="node-desc">Evaluates PromQL Rules</text>
      <text x="20" y="65" class="node-desc">Rate, Error, Duration, Saturation</text>
      <text x="20" y="77" class="node-tag">interval: 15s • eval: 30s</text>
    </g>

    <!-- Source Box 2: Blackbox Exporter -->
    <g transform="translate(15, 160)">
      <rect width="190" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <path d="M 20 25 L 30 25 M 25 20 L 25 30" stroke="#0284c7" stroke-width="2"/>
      <text x="45" y="24" class="node-title">Synthetic Blackbox</text>
      <text x="45" y="38" class="node-desc">External Ingress Probes</text>
      <text x="20" y="65" class="node-desc">HTTP 2xx, TCP, DNS, ICMP</text>
      <text x="20" y="77" class="node-tag">probe_success == 0</text>
    </g>

    <!-- Source Box 3: Custom Microservices -->
    <g transform="translate(15, 265)">
      <rect width="190" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="10" fill="#e0f2fe"/>
      <rect x="21" y="21" width="8" height="8" fill="#0284c7"/>
      <text x="45" y="24" class="node-title">OpenTelemetry / APM</text>
      <text x="45" y="38" class="node-desc">App Custom Metrics</text>
      <text x="20" y="65" class="node-desc">Database timeouts, 5xx Spikes</text>
      <text x="20" y="77" class="node-tag">POST /api/v2/alerts</text>
    </g>

    <!-- Security Context -->
    <g transform="translate(15, 375)">
      <rect width="190" height="105" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="15" y="25" class="node-title" style="font-size: 12px; fill: #475569;">Payload Security</text>
      <text x="15" y="45" class="node-desc">• mTLS In-Flight Transit</text>
      <text x="15" y="65" class="node-desc">• Zero Token Logging</text>
      <text x="15" y="85" class="node-desc">• Label Sanitization Filter</text>
    </g>
  </g>

  <!-- Connectors: Sources -> Core -->
  <path d="M 280 230 L 330 230" class="solid-arrow" marker-end="url(#arrow)"/>
  <path d="M 280 340 L 330 340" class="solid-arrow" marker-end="url(#arrow)"/>

  <!-- Stage 2: Alertmanager Core Routing & Filtering -->
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="460" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="25" y="30" class="group-title">2. Alertmanager Core Processing Pipeline</text>

    <!-- Grouping & Deduplication Box -->
    <g transform="translate(25, 55)">
      <rect width="410" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Intelligent Grouping &amp; Deduplication Engine</text>
      <text x="20" y="45" class="node-desc">group_by: ['namespace', 'alertname', 'cluster', 'service']</text>
      <text x="20" y="65" class="node-desc">group_wait: 30s | group_interval: 5m | repeat_interval: 4h</text>
      <rect x="300" y="50" width="95" height="24" rx="4" fill="#e0f2fe"/>
      <text x="347" y="66" text-anchor="middle" class="node-tag">DEDUP ACTIVE</text>
    </g>

    <!-- Inhibition Rules Filter -->
    <g transform="translate(25, 160)">
      <rect width="410" height="100" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Inhibition &amp; Cascade Suppression Rules</text>
      <text x="20" y="45" class="node-desc">• Inhibit Warning if matching Critical alert is already firing</text>
      <text x="20" y="65" class="node-desc">• Inhibit NodeDown/PodCrashLooping if ClusterDown / AZ Down</text>
      <text x="20" y="85" class="node-desc">• Inhibit API 5xx alerts when Ingress Controller is Offline</text>
      <rect x="300" y="20" width="95" height="24" rx="4" fill="#fef3c7"/>
      <text x="347" y="36" text-anchor="middle" style="font-family: sans-serif; font-size: 10px; font-weight:600; fill: #b45309;">CASCADE SHIELD</text>
    </g>

    <!-- Multi-Branch Routing Decision Tree -->
    <g transform="translate(25, 275)">
      <rect width="410" height="205" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="25" class="node-title">Dynamic Tree-Based Routing Engine</text>

      <g transform="translate(15, 40)">
        <rect width="180" height="65" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
        <text x="12" y="22" style="font-family: sans-serif; font-size: 11px; font-weight:700; fill: #be123c;">MATCH: severity=critical</text>
        <text x="12" y="40" class="node-desc">continue: true</text>
        <text x="12" y="55" class="node-desc">Target: P1 On-Call &amp; War Room</text>
      </g>

      <g transform="translate(210, 40)">
        <rect width="180" height="65" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="12" y="22" style="font-family: sans-serif; font-size: 11px; font-weight:700; fill: #1d4ed8;">MATCH: team=database</text>
        <text x="12" y="40" class="node-desc">Sub-route: warn vs crit</text>
        <text x="12" y="55" class="node-desc">Target: DBA Escalation</text>
      </g>

      <g transform="translate(15, 120)">
        <rect width="180" height="65" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" style="font-family: sans-serif; font-size: 11px; font-weight:700; fill: #15803d;">MATCH: team=security</text>
        <text x="12" y="40" class="node-desc">SOC SIEM Integration</text>
        <text x="12" y="55" class="node-desc">Target: Security Incident Pager</text>
      </g>

      <g transform="translate(210, 120)">
        <rect width="180" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="22" style="font-family: sans-serif; font-size: 11px; font-weight:700; fill: #475569;">DEFAULT CATCH-ALL</text>
        <text x="12" y="40" class="node-desc">severity=warning/info</text>
        <text x="12" y="55" class="node-desc">Target: Slack Team Channels</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Core -> Egress Receivers -->
  <path d="M 790 320 L 850 250" class="solid-arrow" style="stroke: #e11d48;" marker-end="url(#arrow-red)"/>
  <path d="M 790 420 L 850 450" class="solid-arrow" style="stroke: #0d9488;" marker-end="url(#arrow-green)"/>

  <!-- Stage 3: Notification Receivers & Escalation -->
  <g transform="translate(850, 140)">
    <rect x="0" y="0" width="290" height="500" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="30" class="group-title">3. Incident Delivery Endpoints</text>

    <!-- PagerDuty Receiver -->
    <g transform="translate(15, 55)">
      <rect width="260" height="135" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#ffe4e6"/>
      <text x="29" y="34" text-anchor="middle" style="font-family: sans-serif; font-size: 14px; font-weight:bold; fill:#be123c;">PD</text>
      <text x="55" y="26" class="node-title">PagerDuty v2 Enqueue</text>
      <text x="55" y="40" class="node-tag" style="fill: #be123c;">CRITICAL ESCALATION (P1)</text>

      <text x="15" y="68" class="node-desc">• Automatic On-Call Phone &amp; SMS</text>
      <text x="15" y="86" class="node-desc">• Enriched Details: Runbook, Logs</text>
      <text x="15" y="104" class="node-desc">• Auto-Resolve on Prometheus OK</text>
      <text x="15" y="122" class="node-desc">• Escalation Timeout: 5m to Lead</text>
    </g>

    <!-- Slack Webhook Receiver -->
    <g transform="translate(15, 205)">
      <rect width="260" height="175" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="4" fill="#ccfbf1"/>
      <text x="29" y="34" text-anchor="middle" style="font-family: sans-serif; font-size: 14px; font-weight:bold; fill:#0f766e;">#</text>
      <text x="55" y="26" class="node-title">Slack Webhooks &amp; Blocks</text>
      <text x="55" y="40" class="node-tag" style="fill: #0f766e;">INTERACTIVE OPS MESSAGING</text>

      <text x="15" y="68" class="node-desc">• #incident-war-room (P1 Outage)</text>
      <text x="15" y="86" class="node-desc">• #database-ops (Slow queries, PVC)</text>
      <text x="15" y="104" class="node-desc">• #soc-threat-intel (Security alerts)</text>
      <text x="15" y="122" class="node-desc">• One-Click Silence &amp; Runbook URLs</text>
      <text x="15" y="140" class="node-desc">• Dynamic Color State (Red/Yellow/Green)</text>
      <text x="15" y="158" class="node-desc">• Thread Consolidation by Incident</text>
    </g>

    <!-- Email & Webhook Catchall -->
    <g transform="translate(15, 395)">
      <rect width="260" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="15" y="24" class="node-title">Webhook / Event Bus</text>
      <text x="15" y="42" class="node-desc">Custom webhook gateway for ITIL</text>
      <text x="15" y="58" class="node-desc">Jira Service Desk &amp; ServiceNow sync</text>
      <text x="15" y="74" class="node-tag">Auto-ticket creation on severity</text>
    </g>
  </g>
</svg>
